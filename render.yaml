services:
  - type: web
    name: speech-to-text
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: speech-to-text-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: STT_API_KEY
        sync: false

databases:
  - name: speech-to-text-db
    databaseName: speech_to_text
